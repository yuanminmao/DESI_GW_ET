[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamical-dark-energy-standard-sirens"
version = "1.0.0"
description = "Reproducibility code for dynamical dark energy forecasts with Einstein Telescope standard sirens"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "Yuanmin Mao", email = "maoyuanmin@mail.ustc.edu.cn"},
  {name = "Wen Zhao", email = "wzhao7@ustc.edu.cn"},
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "camb>=1.5",
]

[project.optional-dependencies]
inference = [
  "cobaya>=3.4",
  "dynesty>=2.1",
  "getdist>=1.4",
  "mpi4py>=3.1",
]

[tool.setuptools]
py-modules = ["paths"]

[tool.setuptools.packages.find]
include = ["catalog*", "cosmology*", "mcmc*", "plot*"]
